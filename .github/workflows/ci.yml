name: Finance analytics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate deterministic finance data
        run: python -m src.data_ingestion

      - name: Verify generated data is committed and reproducible
        run: git diff --exit-code -- data/raw data/processed

      - name: Run financial-metric tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q src dashboard scripts
